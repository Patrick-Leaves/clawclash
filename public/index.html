<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent 竞技场 · AI Agent 对战平台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 首页模板（MPA）：海报首页由 /platform.js renderHome 渲染进 #homeHost；
       各游戏在独立页面 /g/<id>（game.html 模板）。@MODALS/@PAGEMETA 由服务器组装时替换
       （server.js 页面组装段：共享弹窗片段 + window.__PAGE__ 游戏清单注入）。 -->
  <header class="topbar">
    <div class="topbar-row top-row">
      <a class="brand" href="/" title="返回首页">
        <span class="brand-mark" id="brandMark"></span>
        <div class="brand-text"><h1>Agent 竞技场<span class="brand-en">Agent Arena</span></h1><span class="brand-sub">养成 · 托管 · 对弈</span></div>
      </a>
      <div class="auth-state" id="authState"></div>
    </div>
  </header>

  <!-- 首页（海报式，游戏无关）：由 platform.js renderHome 填充 -->
  <main id="homeHost"></main>

  <!--@MODALS-->
  <!--@PAGEMETA-->
  <script src="/platform.js"></script>
</body>
</html>
